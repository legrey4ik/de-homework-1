version: 2
models:
  - name: fct_orders
    description: "Факт заказов, одна строка — заказ. Тестовые заказы исключены."
    columns:
      - name: order_id
        description: "Номер заказа; ключ витрины."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата оформления заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа без технического значения test."
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']
      - name: order_amount
        description: "Сумма заказа после скидок, в рублях."
        data_tests: [non_negative]
      - name: items_count
        description: "Количество разных товаров в заказе."
        data_tests: [non_negative]
      - name: paid_amount
        description: "Сумма успешных платежей без возвратов."
        data_tests: [non_negative]
      - name: refunded_amount
        description: "Сумма возвратов положительным числом."
        data_tests: [non_negative]
      - name: net_paid_amount
        description: "Успешные оплаты за вычетом возвратов."
      - name: successful_payments_count
        description: "Количество успешных оплат, возвраты исключены."
        data_tests: [non_negative]
      - name: first_paid_at
        description: "Дата и время первой успешной оплаты."
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]

  - name: fct_order_items
    description: "Факт позиций заказа, одна строка — товар в заказе. Тестовые заказы исключены."
    columns:
      - name: order_item_id
        description: "Ключ позиции: order_id-product_id."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Номер заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Ключ товара."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Ключ покупателя, взят из заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: quantity
        description: "Количество единиц товара."
        data_tests: [non_negative]
      - name: unit_price
        description: "Цена за штуку до скидки."
        data_tests: [non_negative]
      - name: discount_amount
        description: "Скидка на всю позицию."
        data_tests: [non_negative]
      - name: line_amount
        description: "Стоимость позиции после скидки: quantity * unit_price - discount_amount."
        data_tests: [non_negative]
      - name: is_confirmed
        description: '{{ doc("confirmed_order") }}'
        data_tests: [not_null]

  - name: dim_customers
    description: "Все зарегистрированные клиенты, одна строка — клиент, в том числе без заказов."
    columns:
      - name: customer_id
        description: "Ключ клиента."
        data_tests: [unique, not_null]
      - name: registered_at
        description: "Время регистрации клиента."
      - name: registration_date
        description: "Дата регистрации клиента."
      - name: city
        description: "Город клиента."
      - name: acquisition_channel
        description: "Канал привлечения."
      - name: first_confirmed_order_id
        description: "Номер первого подтверждённого заказа по времени оплаты или null."
      - name: first_confirmed_at
        description: "Время первой подтверждённой оплаты или null."
      - name: confirmed_orders_count
        description: "Число подтверждённых заказов клиента."
        data_tests: [non_negative]
      - name: confirmed_revenue
        description: "Сумма подтверждённых заказов клиента, без вычета возвратов из других заказов."
        data_tests: [non_negative]
      - name: is_buyer
        description: "Есть хотя бы один подтверждённый заказ."
        data_tests: [not_null]

  - name: dim_products
    description: "Справочник товаров с их категориями, родителями и корнями дерева."
    columns:
      - name: product_id
        description: "Ключ товара."
        data_tests: [unique, not_null]
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд товара."
      - name: category_name
        description: "Категория товара из источника."
      - name: parent_category_name
        description: "Непосредственная родительская категория, null для корневой."
      - name: root_category_name
        description: "Корневая категория, например Electronics или Home."
        data_tests: [not_null]

  - name: dim_dates
    description: "Календарь: одна строка на каждый день между минимальной и максимальной датами заказов."
    columns:
      - name: date_day
        description: "Дата; ключ календаря."
        data_tests: [unique, not_null]
      - name: year
        description: "Год."
      - name: quarter
        description: "Номер квартала от 1 до 4."
      - name: month
        description: "Номер месяца от 1 до 12."
      - name: day
        description: "День месяца."
      - name: day_of_week
        description: "День недели от 1 (пн) до 7 (вс)."
      - name: is_weekend
        description: "Суббота или воскресенье."
