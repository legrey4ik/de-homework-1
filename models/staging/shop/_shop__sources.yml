version: 2
sources:
  - name: shop
    description: "Копия таблиц PostgreSQL в Greenplum, схема raw; загружается сервисом loader."
    database: dwh
    schema: raw
    tables:
      - name: customers
        description: "Клиенты, включая тех, кто не оформлял заказов."
        columns:
          - name: customer_id
            data_tests: [unique, not_null]
      - name: products
        description: "Товары: категория записана текстом."
        columns:
          - name: product_id
            data_tests: [unique, not_null]
      - name: product_categories
        description: "Категории товаров с parent_category_id."
        columns:
          - name: category_id
            data_tests: [unique, not_null]
      - name: orders
        description: "Заказы: в источнике есть технический статус test."
        columns:
          - name: order_id
            data_tests: [unique, not_null]
      - name: order_items
        description: "Товары в заказах, ключ (order_id, product_id)."
      - name: payments
        description: "Попытки платежей, частичные оплаты и возвраты."
        columns:
          - name: payment_id
            data_tests: [unique, not_null]
